name: White-Label or Agency Inquiry
description: Request paid white-label audit/spec support for an agency, consultant, or automation practice.
title: "White-label inquiry: "
labels: ["white-label"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form if you want a paid white-label audit/spec draft or adaptation for your agency or consulting practice. Do not include credentials, secrets, regulated personal data, or unanonymized customer records.
  - type: input
    id: organization
    attributes:
      label: Organization or project
      placeholder: "Company, agency, solo practice, or project name"
    validations:
      required: true
  - type: dropdown
    id: use_case
    attributes:
      label: Use case
      options:
        - White-label Starter audit/spec draft - $149
        - White-label Builder audit/spec draft - $349
        - Focused sprint handoff package - $1,250
        - Adapt for Airtable/Make/Zapier/n8n consulting
        - Adapt for operations consulting
        - Other
    validations:
      required: true
  - type: textarea
    id: adaptation
    attributes:
      label: Workflow or adaptation needed
      placeholder: "Example: white-label draft for a support-ticket triage workflow, Airtable-specific schema section, Spanish version, branded report template..."
    validations:
      required: true
  - type: textarea
    id: materials
    attributes:
      label: Materials you can provide
      placeholder: "Anonymized notes, screenshots, exports, process summaries, client discovery transcript, or sample docs..."
    validations:
      required: false
  - type: input
    id: budget
    attributes:
      label: Budget or target package
      placeholder: "$349 customization, $1,250 sprint, or custom quote"
    validations:
      required: false
  - type: checkboxes
    id: boundary
    attributes:
      label: Safety boundary
      options:
        - label: I will not include private credentials, customer secrets, or regulated personal data in this issue.
          required: true
